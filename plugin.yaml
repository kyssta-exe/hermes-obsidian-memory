name: obsidian-memory
version: 4.0.0
manifest_version: 2
description: "Browse, search, and edit your Obsidian vault notes from Hermes — desktop pane, dashboard tab, force-directed graph, multi-vault support, markdown rendering with wikilinks, and inline editing."
author: Kyssta
license: MIT
homepage: https://github.com/kyssta-exe/hermes-obsidian-memory
tags:
  - obsidian
  - notes
  - knowledge-base
  - graph
  - dashboard
  - desktop
provides_tools: []
provides_hooks: []
dependencies: []
requires_env: []
requires_hermes: ">=0.21.0"
python_dependencies: []
config_schema:
  vault_roots:
    type: str
    default: ""
    label: Vault roots
    description: "One directory per line. Any subdirectory containing a `.obsidian` marker folder is discovered as a vault; each root and its immediate children are scanned."
